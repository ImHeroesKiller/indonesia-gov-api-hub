name: Deploy Investment Intelligence

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/probe-*.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nusadata-investment-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate investment frontend
        shell: bash
        run: |
          set -e
          node --check app.js
          jq -e '.policy.public_rest_only==true and .policy.investment_scope_only==true' data/investment-sources.json >/dev/null
          jq -e '.min_coverage_for_score==0.70 and ([.factors[].weight]|add)==100' data/investment-model.json >/dev/null
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const ids=[...html.matchAll(/id="([^"]+)"/g)].map(x=>x[1]);
          const dup=ids.filter((x,i)=>ids.indexOf(x)!==i);
          if(dup.length){console.error('Duplicate IDs',[...new Set(dup)]);process.exit(1)}
          const required=[
            'coveragePercent','coverageLabel','coverageMeter','snapshotTime',
            'eligibleSources','industryDatasetCount','wellCount','workingAreaCount',
            'modelStatus','scoreBadge','factorGrid','sourceCoverage',
            'industryHighlights','energyHighlights','macroInstitutions',
            'tradeInstitutions','industrialThemes','industrialFeed',
            'energyWellCount','energyWKCount','workingAreaList','wellSampleList','sourceMatrix'
          ];
          const missing=required.filter(id=>!ids.includes(id));
          if(missing.length){console.error('Missing DOM contract',missing);process.exit(1)}
          console.log('Investment dashboard contract OK:',required.length);
          NODE

      - name: Fetch verified investment REST data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live tmp-invest

          curl_json () {
            url="$1"; out="$2"
            curl -fL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 12 --max-time 60 \
              -A "NusaData-Investment/1.0 (+https://github.com/ImHeroesKiller/indonesia-gov-api-hub)" \
              -H "Accept: application/json" -sS "$url" -o "$out"
            jq -e . "$out" >/dev/null
          }

          curl_json_optional () {
            url="$1"; out="$2"
            if curl -fL --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 8 --max-time 25 \
              -A "NusaData-Investment/1.0 (+https://github.com/ImHeroesKiller/indonesia-gov-api-hub)" \
              -H "Accept: application/json" -sS "$url" -o "$out" && jq -e . "$out" >/dev/null 2>&1; then
              return 0
            fi
            return 1
          }

          # Kementerian Perindustrian
          # Official CKAN REST is documented, but the host is currently not reliably
          # reachable from deployment runners. Keep the gap explicit and non-blocking.
          cat > live/investment-industry.json <<'EOF'
          {
            "available": false,
            "reason": "Official Kemenperin CKAN REST is documented but currently unreachable from the deployment runner.",
            "themes": {},
            "items": []
          }
          EOF

          # Kementerian ESDM — official ArcGIS REST
          curl_json "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/well/MapServer/0/query?where=1%3D1&returnCountOnly=true&f=json" "tmp-invest/esdm-well-count.json"
          curl_json "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/well/MapServer/0/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=8&f=json" "tmp-invest/esdm-well-sample.json"
          curl_json "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/WK_2026_TAHAP_1/MapServer/0/query?where=1%3D1&returnCountOnly=true&f=json" "tmp-invest/esdm-wk-count.json"
          curl_json "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/WK_2026_TAHAP_1/MapServer/0/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=20&f=json" "tmp-invest/esdm-wk-sample.json"

          jq -e '.count>0' tmp-invest/esdm-well-count.json >/dev/null
          jq -e '.count>0' tmp-invest/esdm-wk-count.json >/dev/null
          jq -e '(.features|type=="array")' tmp-invest/esdm-well-sample.json >/dev/null
          jq -e '(.features|type=="array")' tmp-invest/esdm-wk-sample.json >/dev/null

          jq -n \
            --slurpfile wc tmp-invest/esdm-well-count.json \
            --slurpfile ws tmp-invest/esdm-well-sample.json \
            --slurpfile kc tmp-invest/esdm-wk-count.json \
            --slurpfile ks tmp-invest/esdm-wk-sample.json \
            '{
              generated_at:(now|todateiso8601),
              well_count:($wc[0].count//0),
              working_area_count:($kc[0].count//0),
              well_samples:[$ws[0].features[]?.attributes],
              working_areas:[$ks[0].features[]?.attributes]
            }' > live/investment-energy.json

          ACTIVE_WEIGHT=$(jq '[.institutions[]|select(.status=="active")|.weight]|add // 0' data/investment-sources.json)
          ACTIVE_COUNT=$(jq '[.institutions[]|select(.status=="active")]|length' data/investment-sources.json)
          TOTAL_COUNT=$(jq '.institutions|length' data/investment-sources.json)
          INDUSTRY_COUNT=$(jq '[.themes[]?.count]|add // 0' live/investment-industry.json)
          WELL_COUNT=$(jq '.well_count' live/investment-energy.json)
          WK_COUNT=$(jq '.working_area_count' live/investment-energy.json)

          cat > live/investment-summary.json <<EOF
          {
            "generated_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "eligible_sources":$ACTIVE_COUNT,
            "total_priority_sources":$TOTAL_COUNT,
            "coverage_weight":$ACTIVE_WEIGHT,
            "score_ready":$( [ "$ACTIVE_WEIGHT" -ge 70 ] && echo true || echo false ),
            "industry_dataset_matches":$INDUSTRY_COUNT,
            "esdm_wells":$WELL_COUNT,
            "esdm_working_areas_2026":$WK_COUNT
          }
          EOF

          cp live/investment-summary.json live/investment-status.json

          jq -e '.coverage_weight>=0 and .total_priority_sources==8' live/investment-summary.json >/dev/null
          jq -e '(.items|type=="array") and (.themes|type=="object")' live/investment-industry.json >/dev/null
          jq -e '.well_count>0 and .working_area_count>0' live/investment-energy.json >/dev/null

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        uses: actions/deploy-pages@v4
