name: Deploy Business Cost & Compliance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nusadata-business-cost-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate frontend and 2026 ruleset
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          jq -e '.scope=="business-cost-compliance" and .updated_at=="2026-09-21"' data/business-rates.json >/dev/null
          jq -e '.tax.corporate.general_rate==0.22' data/business-rates.json >/dev/null
          jq -e '.tax.corporate.section31e_reduced_rate==0.11' data/business-rates.json >/dev/null
          jq -e '.tax.vat.non_luxury_effective_rate==0.11 and .tax.vat.luxury_effective_rate==0.12' data/business-rates.json >/dev/null
          jq -e '.bpjs.health.employer_rate==0.04 and .bpjs.health.employee_rate==0.01 and .bpjs.health.wage_ceiling==12000000' data/business-rates.json >/dev/null
          jq -e '.bpjs.employment.jht.employer_rate==0.037 and .bpjs.employment.jht.employee_rate==0.02' data/business-rates.json >/dev/null
          jq -e '.bpjs.employment.jp.employer_rate==0.02 and .bpjs.employment.jp.employee_rate==0.01 and .bpjs.employment.jp.wage_ceiling_current>10000000' data/business-rates.json >/dev/null
          jq -e '(.wages_2026|length)>=10 and all(.wages_2026[];.value>3000000)' data/business-rates.json >/dev/null

          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const ids=[...html.matchAll(/id="([^"]+)"/g)].map(x=>x[1]);
          const dup=ids.filter((x,i)=>ids.indexOf(x)!==i);
          if(dup.length){console.error('Duplicate IDs',[...new Set(dup)]);process.exit(1)}
          const required=[
            'rulesUpdated','overviewPayroll','overviewTax','wageBenchmarkGrid',
            'regionSelect','sectoralWrap','useSectoral','salaryInput','minimumWageHint',
            'headcountInput','jkkSelect','includeThr','wageCompliance','totalEmployerCost',
            'totalEmployerCostPerEmployee','employerBreakdown','employerBpjsCards',
            'employeeNetBeforeTax','employeeDeductions','entitySelect','revenueInput',
            'profitInput','taxRuleHint','incomeTaxResult','incomeTaxMethod',
            'incomeTaxEffective','incomeTaxMonthly','vatBaseInput','vatTypeSelect',
            'vatResult','vatMethod','withholdingGrid','sourceList'
          ];
          const missing=required.filter(id=>!ids.includes(id));
          if(missing.length){console.error('Missing DOM contract',missing);process.exit(1)}
          console.log('Business dashboard DOM contract OK:',required.length);
          NODE

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        uses: actions/deploy-pages@v4
