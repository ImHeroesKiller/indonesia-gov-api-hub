name: Deploy Investment Intelligence

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/probe-*.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nusadata-investment-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate investment frontend
        shell: bash
        run: |
          set -e
          node --check app.js
          jq -e '.policy.public_rest_only==true and .policy.investment_scope_only==true' data/investment-sources.json >/dev/null
          jq -e '.min_coverage_for_score==0.70 and ([.factors[].weight]|add)==100' data/investment-model.json >/dev/null
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const ids=[...html.matchAll(/id="([^"]+)"/g)].map(x=>x[1]);
          const dup=ids.filter((x,i)=>ids.indexOf(x)!==i);
          if(dup.length){console.error('Duplicate IDs',[...new Set(dup)]);process.exit(1)}
          const required=[
            'coveragePercent','coverageLabel','coverageMeter','snapshotTime',
            'eligibleSources','industryDatasetCount','wellCount','workingAreaCount',
            'modelStatus','scoreBadge','factorGrid','sourceCoverage',
            'industryHighlights','energyHighlights','macroInstitutions',
            'tradeInstitutions','industrialThemes','industrialFeed',
            'energyWellCount','energyWKCount','workingAreaList','wellSampleList','sourceMatrix',
            'regionalProvinceCount','regionalDatasetTotal','regionalInvestmentGrid'
          ];
          const missing=required.filter(id=>!ids.includes(id));
          if(missing.length){console.error('Missing DOM contract',missing);process.exit(1)}
          console.log('Investment dashboard contract OK:',required.length);
          NODE

      - name: Fetch verified investment REST data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live tmp-invest

          curl_json () {
            url="$1"; out="$2"
            curl -fL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 12 --max-time 60 \
              -A "NusaData-Investment/1.0 (+https://github.com/ImHeroesKiller/indonesia-gov-api-hub)" \
              -H "Accept: application/json" -sS "$url" -o "$out"
            jq -e . "$out" >/dev/null
          }

          curl_json_optional () {
            url="$1"; out="$2"
            if curl -fL --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 8 --max-time 25 \
              -A "NusaData-Investment/1.0 (+https://github.com/ImHeroesKiller/indonesia-gov-api-hub)" \
              -H "Accept: application/json" -sS "$url" -o "$out" && jq -e . "$out" >/dev/null 2>&1; then
              return 0
            fi
            return 1
          }

          # Kementerian Perindustrian — documented public CKAN REST.
          # Optional at deploy time because the host is currently not consistently reachable
          # from cloud/GitHub runners. Never fail production because of this source.
          KEMENPERIN_OK=true
          curl_json_optional "https://satudata.kemenperin.go.id/id/api/3/action/package_search?q=nikel&rows=10&sort=metadata_modified%20desc" "tmp-invest/kemenperin-nickel.json" || KEMENPERIN_OK=false
          curl_json_optional "https://satudata.kemenperin.go.id/id/api/3/action/package_search?q=kawasan%20industri&rows=10&sort=metadata_modified%20desc" "tmp-invest/kemenperin-estate.json" || KEMENPERIN_OK=false
          curl_json_optional "https://satudata.kemenperin.go.id/id/api/3/action/package_search?q=kapasitas%20produksi&rows=10&sort=metadata_modified%20desc" "tmp-invest/kemenperin-capacity.json" || KEMENPERIN_OK=false
          curl_json_optional "https://satudata.kemenperin.go.id/id/api/3/action/package_search?q=kendaraan%20listrik&rows=10&sort=metadata_modified%20desc" "tmp-invest/kemenperin-ev.json" || KEMENPERIN_OK=false
          curl_json_optional "https://satudata.kemenperin.go.id/id/api/3/action/package_search?q=industri%20hijau&rows=10&sort=metadata_modified%20desc" "tmp-invest/kemenperin-green.json" || KEMENPERIN_OK=false

          if [ "$KEMENPERIN_OK" = true ]; then
            for f in tmp-invest/kemenperin-*.json; do
              jq -e '.success==true and (.result.results|type=="array")' "$f" >/dev/null || KEMENPERIN_OK=false
            done
          fi

          if [ "$KEMENPERIN_OK" = true ]; then
            jq -n \
              --slurpfile nickel tmp-invest/kemenperin-nickel.json \
              --slurpfile estate tmp-invest/kemenperin-estate.json \
              --slurpfile capacity tmp-invest/kemenperin-capacity.json \
              --slurpfile ev tmp-invest/kemenperin-ev.json \
              --slurpfile green tmp-invest/kemenperin-green.json \
              '{
                available:true,
                generated_at:(now|todateiso8601),
                themes:{
                  nickel:{count:($nickel[0].result.count//0)},
                  industrial_estate:{count:($estate[0].result.count//0)},
                  capacity:{count:($capacity[0].result.count//0)},
                  ev:{count:($ev[0].result.count//0)},
                  green_industry:{count:($green[0].result.count//0)}
                },
                items:(
                  (
                    [$nickel[0].result.results[]? | {theme:"nickel",name,title,url:("https://satudata.kemenperin.go.id/dataset/"+.name),metadata_modified}] +
                    [$estate[0].result.results[]? | {theme:"industrial_estate",name,title,url:("https://satudata.kemenperin.go.id/dataset/"+.name),metadata_modified}] +
                    [$capacity[0].result.results[]? | {theme:"capacity",name,title,url:("https://satudata.kemenperin.go.id/dataset/"+.name),metadata_modified}] +
                    [$ev[0].result.results[]? | {theme:"ev",name,title,url:("https://satudata.kemenperin.go.id/dataset/"+.name),metadata_modified}] +
                    [$green[0].result.results[]? | {theme:"green_industry",name,title,url:("https://satudata.kemenperin.go.id/dataset/"+.name),metadata_modified}]
                  )
                  | unique_by(.name)
                  | sort_by(.metadata_modified//"")
                  | reverse
                  | .[:20]
                )
              }' > live/investment-industry.json
          else
            cat > live/investment-industry.json <<'EOF'
          {
            "available": false,
            "reason": "Official Kemenperin CKAN REST is temporarily unreachable from the deployment runner.",
            "themes": {},
            "items": []
          }
          EOF
          fi

          # Kementerian ESDM — official ArcGIS REST
          curl_json "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/well/MapServer/0/query?where=1%3D1&returnCountOnly=true&f=json" "tmp-invest/esdm-well-count.json"
          curl_json "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/well/MapServer/0/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=8&f=json" "tmp-invest/esdm-well-sample.json"
          curl_json "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/WK_2026_TAHAP_1/MapServer/0/query?where=1%3D1&returnCountOnly=true&f=json" "tmp-invest/esdm-wk-count.json"
          curl_json "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/WK_2026_TAHAP_1/MapServer/0/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=20&f=json" "tmp-invest/esdm-wk-sample.json"

          jq -e '.count>0' tmp-invest/esdm-well-count.json >/dev/null
          jq -e '.count>0' tmp-invest/esdm-wk-count.json >/dev/null
          jq -e '(.features|type=="array")' tmp-invest/esdm-well-sample.json >/dev/null
          jq -e '(.features|type=="array")' tmp-invest/esdm-wk-sample.json >/dev/null

          jq -n \
            --slurpfile wc tmp-invest/esdm-well-count.json \
            --slurpfile ws tmp-invest/esdm-well-sample.json \
            --slurpfile kc tmp-invest/esdm-wk-count.json \
            --slurpfile ks tmp-invest/esdm-wk-sample.json \
            '{
              generated_at:(now|todateiso8601),
              well_count:($wc[0].count//0),
              working_area_count:($kc[0].count//0),
              well_samples:[$ws[0].features[]?.attributes],
              working_areas:[$ks[0].features[]?.attributes]
            }' > live/investment-energy.json

          # Regional investment capacity — verified provincial CKAN REST
          curl_json "https://data.acehprov.go.id/id/api/3/action/package_search?rows=20&sort=metadata_modified%20desc" "tmp-invest/aceh.json" &
          r1=$!
          curl_json "https://data.sumbarprov.go.id/api/3/action/package_search?rows=20&sort=metadata_modified%20desc" "tmp-invest/sumbar.json" &
          r2=$!
          curl_json "https://opendata.sumselprov.go.id/api/3/action/package_search?rows=20&sort=metadata_modified%20desc" "tmp-invest/sumsel.json" &
          r3=$!
          curl_json "https://data.bantenprov.go.id/api/3/action/package_search?rows=20&sort=metadata_modified%20desc" "tmp-invest/banten.json" &
          r4=$!
          curl_json "https://data.jatengprov.go.id/api/3/action/package_search?rows=20&sort=metadata_modified%20desc" "tmp-invest/jateng.json" &
          r5=$!
          curl_json "https://data.kaltimprov.go.id/api/3/action/package_search?rows=20&sort=metadata_modified%20desc" "tmp-invest/kaltim.json" &
          r6=$!
          wait "$r1" "$r2" "$r3" "$r4" "$r5" "$r6"

          for f in tmp-invest/aceh.json tmp-invest/sumbar.json tmp-invest/sumsel.json tmp-invest/banten.json tmp-invest/jateng.json tmp-invest/kaltim.json; do
            jq -e '.success==true and (.result.results|type=="array")' "$f" >/dev/null
          done

          jq -n \
            --slurpfile ac tmp-invest/aceh.json \
            --slurpfile sb tmp-invest/sumbar.json \
            --slurpfile ss tmp-invest/sumsel.json \
            --slurpfile bt tmp-invest/banten.json \
            --slurpfile jt tmp-invest/jateng.json \
            --slurpfile kt tmp-invest/kaltim.json \
            '{
              generated_at:(now|todateiso8601),
              verified_provinces:6,
              target_provinces:38,
              regions:[
                {key:"aceh",name:"Aceh",level:"provinsi",available:true,count:($ac[0].result.count//0),items:($ac[0].result.results//[])},
                {key:"sumbar",name:"Sumatera Barat",level:"provinsi",available:true,count:($sb[0].result.count//0),items:($sb[0].result.results//[])},
                {key:"sumsel",name:"Sumatera Selatan",level:"provinsi",available:true,count:($ss[0].result.count//0),items:($ss[0].result.results//[])},
                {key:"banten",name:"Banten",level:"provinsi",available:true,count:($bt[0].result.count//0),items:($bt[0].result.results//[])},
                {key:"jateng",name:"Jawa Tengah",level:"provinsi",available:true,count:($jt[0].result.count//0),items:($jt[0].result.results//[])},
                {key:"kaltim",name:"Kalimantan Timur",level:"provinsi",available:true,count:($kt[0].result.count//0),items:($kt[0].result.results//[])}
              ]
            }' > live/regional-summary.json

          jq -e '.verified_provinces==6 and ([.regions[].count]|add)>0' live/regional-summary.json >/dev/null

          ACTIVE_WEIGHT=$(jq '[.institutions[]|select(.status=="active")|.weight]|add // 0' data/investment-sources.json)
          ACTIVE_COUNT=$(jq '[.institutions[]|select(.status=="active")]|length' data/investment-sources.json)
          TOTAL_COUNT=$(jq '.institutions|length' data/investment-sources.json)
          INDUSTRY_COUNT=$(jq '[.themes[]?.count]|add // 0' live/investment-industry.json)
          WELL_COUNT=$(jq '.well_count' live/investment-energy.json)
          WK_COUNT=$(jq '.working_area_count' live/investment-energy.json)
          VERIFIED_PROVINCES=$(jq '.verified_provinces' live/regional-summary.json)
          REGIONAL_DATASET_TOTAL=$(jq '[.regions[].count]|add // 0' live/regional-summary.json)

          cat > live/investment-summary.json <<EOF
          {
            "generated_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "eligible_sources":$ACTIVE_COUNT,
            "total_priority_sources":$TOTAL_COUNT,
            "coverage_weight":$ACTIVE_WEIGHT,
            "score_ready":$( [ "$ACTIVE_WEIGHT" -ge 70 ] && echo true || echo false ),
            "industry_dataset_matches":$INDUSTRY_COUNT,
            "esdm_wells":$WELL_COUNT,
            "esdm_working_areas_2026":$WK_COUNT,
            "verified_provinces":$VERIFIED_PROVINCES,
            "regional_dataset_total":$REGIONAL_DATASET_TOTAL
          }
          EOF

          cp live/investment-summary.json live/investment-status.json

          jq -e '.coverage_weight>=0 and .total_priority_sources==8' live/investment-summary.json >/dev/null
          jq -e '(.items|type=="array") and (.themes|type=="object")' live/investment-industry.json >/dev/null
          jq -e '.well_count>0 and .working_area_count>0' live/investment-energy.json >/dev/null

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        uses: actions/deploy-pages@v4
