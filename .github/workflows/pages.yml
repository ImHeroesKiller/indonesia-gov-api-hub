name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate frontend
        run: |
          node --check app.js
          node -e "const x=JSON.parse(require('fs').readFileSync('data/apis.json','utf8')); if(!x.policy?.public_rest_only) process.exit(1); if(x.sources.some(s=>s.auth!=='none')) process.exit(1); console.log('Public REST allowlist OK')"

      - name: Fetch verified public REST data
        shell: bash
        run: |
          set -e
          mkdir -p live

          curl_json () {
            url="$1"
            out="$2"
            curl -fL --retry 2 --retry-delay 2 --connect-timeout 12 --max-time 35               -A "NusaData/1.0 (+https://github.com/ImHeroesKiller/indonesia-gov-api-hub)"               -H "Accept: application/json"               -sS "$url" -o "$out"
            jq -e . "$out" >/dev/null
          }

          curl_json             "https://api.bmkg.go.id/publik/prakiraan-cuaca?adm4=31.71.03.1001"             "live/weather-kemayoran.json"

          curl_json             "https://data.bmkg.go.id/DataMKG/TEWS/autogempa.json"             "live/earthquake-latest.json"

          curl_json             "https://data.bmkg.go.id/DataMKG/TEWS/gempaterkini.json"             "live/earthquake-m5.json"

          curl_json             "https://data.bmkg.go.id/DataMKG/TEWS/gempadirasakan.json"             "live/earthquake-felt.json"

          jq -e '(.data|type=="array") and (.data|length>0)' live/weather-kemayoran.json >/dev/null
          jq -e '.Infogempa.gempa != null' live/earthquake-latest.json >/dev/null
          jq -e '(.Infogempa.gempa|type=="array")' live/earthquake-m5.json >/dev/null
          jq -e '(.Infogempa.gempa|type=="array")' live/earthquake-felt.json >/dev/null

          cat > live/status.json <<EOF
          {
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "policy": "public-rest-no-auth-only",
            "weather_available": true,
            "earthquake_latest_available": true,
            "earthquake_m5_available": true,
            "earthquake_felt_available": true
          }
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
