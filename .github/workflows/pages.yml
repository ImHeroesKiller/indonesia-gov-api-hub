name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nusadata-github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate frontend
        run: |
          node --check app.js
          node -e "const x=JSON.parse(require('fs').readFileSync('data/apis.json','utf8')); if(!x.policy?.public_rest_only) process.exit(1); if(x.sources.some(s=>s.auth!=='none')) process.exit(1); console.log('Public REST allowlist OK:', x.sources.length, 'sources')"
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const ids=[...html.matchAll(/id="([^"]+)"/g)].map(x=>x[1]);
          const dup=ids.filter((x,i)=>ids.indexOf(x)!==i);
          if(dup.length){console.error('Duplicate IDs:',[...new Set(dup)]);process.exit(1)}
          const required=[
            'dashboardHealth','dashboardUpdated','activeSourceCount','dashboardDatasetCount',
            'bigSummaryCount','dashboardM5Count','enterpriseSummaryCount','dashboardPamTotal',
            'weatherNow','latestQuake','dashboardCoverageBars','dashboardSourceMix',
            'dashboardQuakes','dashboardEnterpriseHighlights','dashboardDatasets',
            'dashboardEnterpriseFeed','dashboardSourceHealth','foodstationProducts',
            'pamjayaTop','waskitaPosts','sourceGrid','dashboardDomainGrid',
            'dashboardOperationalDomains','domainExplorerGrid','domainOperationalGrid','indicatorGrid',
            'dashboardDirectStats','dashboardIHK','dashboardFoodPrices','directStatsDetail',
            'directIHKTable','directFoodPriceGrid','directAgriculture','regionalCoverage'
          ];
          const missing=required.filter(id=>!ids.includes(id));
          if(missing.length){console.error('Missing dashboard IDs:',missing);process.exit(1)}
          console.log('Dashboard DOM contract OK:',required.length,'required IDs');
          NODE

      - name: Fetch verified public REST data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live tmp-domains

          curl_json () {
            url="$1"
            out="$2"
            curl -fL --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 12 --max-time 60 \
              -A "NusaData/1.0 (+https://github.com/ImHeroesKiller/indonesia-gov-api-hub)" \
              -H "Accept: application/json" \
              -sS "$url" -o "$out"
            jq -e . "$out" >/dev/null
          }

          curl_json_optional () {
            url="$1"
            out="$2"
            if curl -fL --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 12 --max-time 45 \
              -A "NusaData/1.0 (+https://github.com/ImHeroesKiller/indonesia-gov-api-hub)" \
              -H "Accept: application/json" \
              -sS "$url" -o "$out" && jq -e . "$out" >/dev/null 2>&1; then
              return 0
            fi
            printf '%s\n' '{"success":false,"unavailable":true,"result":{"count":0,"results":[]}}' > "$out"
          }

          fetch_domain () {
            slug="$1"
            query="$2"
            b="tmp-domains/${slug}-banten.json"
            g="tmp-domains/${slug}-grobogan.json"
            q_enc=$(jq -rn --arg v "$query" '$v|@uri')

            curl_json "https://data.bantenprov.go.id/api/3/action/package_search?q=${q_enc}&rows=6&sort=metadata_modified%20desc" "$b"
            curl_json "https://opendata.grobogan.go.id/api/3/action/package_search?q=${q_enc}&rows=6&sort=metadata_modified%20desc" "$g"

            jq -n \
              --arg domain "$slug" \
              --arg query "$query" \
              --slurpfile b "$b" \
              --slurpfile g "$g" \
              '{
                domain:$domain,
                query:$query,
                count:(($b[0].result.count // 0)+($g[0].result.count // 0)),
                sources:{
                  banten:($b[0].result.count // 0),
                  grobogan:($g[0].result.count // 0)
                },
                items:(
                  (
                    [$b[0].result.results[]? | . + {source:"Banten",source_key:"banten"}] +
                    [$g[0].result.results[]? | . + {source:"Grobogan",source_key:"grobogan"}]
                  )
                  | sort_by(.metadata_modified // "")
                  | reverse
                  | .[:8]
                )
              }' > "live/domain-${slug}.json"
          }

          # Weather & disaster
          curl_json "https://api.bmkg.go.id/publik/prakiraan-cuaca?adm4=31.71.03.1001" "live/weather-kemayoran.json"
          curl_json "https://data.bmkg.go.id/DataMKG/TEWS/autogempa.json" "live/earthquake-latest.json"
          curl_json "https://data.bmkg.go.id/DataMKG/TEWS/gempaterkini.json" "live/earthquake-m5.json"
          curl_json "https://data.bmkg.go.id/DataMKG/TEWS/gempadirasakan.json" "live/earthquake-felt.json"

          # Geospatial & administration
          curl_json "https://geoservices.big.go.id/rbi/rest/services/BATASWILAYAH/Administrasi_AR_KelDesa_10K/MapServer/0/query?where=1%3D1&returnCountOnly=true&f=json" "live/big-village-count.json"
          curl_json "https://geoservices.big.go.id/rbi/rest/services/BATASWILAYAH/Administrasi_AR_KelDesa_10K/MapServer/0/query?where=1%3D1&outFields=NAMOBJ%2CWADMKD%2CWADMKC%2CWADMKK%2CWADMPR%2CKDEPUM&returnGeometry=false&resultRecordCount=12&orderByFields=OBJECTID&f=json" "live/big-village-sample.json"

          # Cross-domain government catalogs
          curl_json "https://data.bantenprov.go.id/api/3/action/package_search?rows=20&sort=metadata_modified%20desc" "live/banten-datasets.json"
          curl_json "https://opendata.grobogan.go.id/api/3/action/package_search?rows=20&sort=metadata_modified%20desc" "live/grobogan-datasets.json"

          # BUMN / BUMD
          curl_json "https://foodstation.id/wp-json/wc/store/products?per_page=24" "live/foodstation-products.json"
          curl_json "https://geoportal.pamjaya.co.id/server/rest/services/DATA/KELUHAN/MapServer/3/query?where=1%3D1&outFields=kelurahan%2Ckecamatan%2Ckotamadya%2Csum_keluha&returnGeometry=false&f=json" "live/pamjaya-complaints.json"
          curl_json "https://www.waskita.co.id/wp-json/wp/v2/posts?per_page=12&_fields=id,date,link,title,excerpt" "live/waskita-posts.json"

          # Transport & infrastructure
          curl_json "https://gis-dpmptsp.jakarta.go.id/arcgis/rest/services/Hosted/Titik_Transportasi_Umum_Jakarta_v3/FeatureServer/26/query?where=1%3D1&outFields=jenis%2Cfungsi&returnGeometry=false&resultRecordCount=2000&f=json" "live/jakarta-transport.json"
          curl_json "https://gis-dpmptsp.jakarta.go.id/arcgis/rest/services/Hosted/Peta_Jalan_DKI/FeatureServer/1/query?where=1%3D1&returnCountOnly=true&f=json" "live/jakarta-roads-count.json"
          curl_json "https://gis-dpmptsp.jakarta.go.id/arcgis/rest/services/Hosted/rdtr_2022_new/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json" "live/jakarta-rdtr-count.json"

          # Energy & oil/gas
          curl_json "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/well/MapServer/0/query?where=1%3D1&returnCountOnly=true&f=json" "live/esdm-wells-count.json"
          curl_json "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/WK_2026_TAHAP_1/MapServer/0/query?where=1%3D1&returnCountOnly=true&f=json" "live/esdm-wk2026-count.json"

          # Cross-province public CKAN catalogs
          curl_json_optional "https://data.sumbarprov.go.id/api/3/action/package_search?rows=20&sort=metadata_modified%20desc" "live/sumbar-datasets.json"
          curl_json_optional "https://opendata.sumselprov.go.id/api/3/action/package_search?rows=20&sort=metadata_modified%20desc" "live/sumsel-datasets.json"
          curl_json_optional "https://data.kalbarprov.go.id/api/3/action/package_search?rows=20&sort=metadata_modified%20desc" "live/kalbar-datasets.json"

          jq -e '(.result.results|type=="array")' live/sumbar-datasets.json >/dev/null
          jq -e '(.result.results|type=="array")' live/sumsel-datasets.json >/dev/null
          jq -e '(.result.results|type=="array")' live/kalbar-datasets.json >/dev/null

          jq -n --slurpfile b live/banten-datasets.json --slurpfile g live/grobogan-datasets.json --slurpfile sb live/sumbar-datasets.json --slurpfile ss live/sumsel-datasets.json --slurpfile kb live/kalbar-datasets.json '
            {
              generated_at:(now|todateiso8601),
              regions:[
                {key:"banten",name:"Banten",available:true,count:($b[0].result.count//0),items:($b[0].result.results//[])},
                {key:"grobogan",name:"Grobogan",available:true,count:($g[0].result.count//0),items:($g[0].result.results//[])},
                {key:"sumbar",name:"Sumatera Barat",available:($sb[0].success==true),count:($sb[0].result.count//0),items:($sb[0].result.results//[])},
                {key:"sumsel",name:"Sumatera Selatan",available:($ss[0].success==true),count:($ss[0].result.count//0),items:($ss[0].result.results//[])},
                {key:"kalbar",name:"Kalimantan Barat",available:($kb[0].success==true),count:($kb[0].result.count//0),items:($kb[0].result.results//[])}
              ]
            }' > live/regional-summary.json
          jq -e '(.regions|length)==5' live/regional-summary.json >/dev/null

          # Direct statistical indicators from verified public CKAN datasets
          fetch_indicator () {
            slug="$1"
            query="$2"
            out="live/indicator-${slug}.json"
            b="tmp-domains/indicator-${slug}-b.json"
            g="tmp-domains/indicator-${slug}-g.json"
            q_enc=$(jq -rn --arg v "$query" '$v|@uri')

            curl_json "https://data.bantenprov.go.id/api/3/action/package_search?q=${q_enc}&rows=8&sort=metadata_modified%20desc" "$b"
            curl_json "https://opendata.grobogan.go.id/api/3/action/package_search?q=${q_enc}&rows=8&sort=metadata_modified%20desc" "$g"

            jq -n --arg slug "$slug" --arg query "$query" --slurpfile b "$b" --slurpfile g "$g" '
              {
                indicator:$slug,
                query:$query,
                matches:(($b[0].result.count//0)+($g[0].result.count//0)),
                datasets:(
                  (
                    [$b[0].result.results[]? | . + {source:"Banten",source_key:"banten"}] +
                    [$g[0].result.results[]? | . + {source:"Grobogan",source_key:"grobogan"}]
                  )
                  | sort_by(.metadata_modified//"")
                  | reverse
                  | .[:8]
                )
              }' > "$out"
          }

          fetch_indicator "inflation" "inflasi"
          fetch_indicator "food-prices" "harga pangan"
          fetch_indicator "schools" "sekolah"
          fetch_indicator "health-facilities" "puskesmas rumah sakit"
          fetch_indicator "unemployment" "pengangguran"
          fetch_indicator "poverty" "kemiskinan"
          fetch_indicator "regional-budget" "APBD"
          fetch_indicator "environment-quality" "kualitas lingkungan"
          fetch_indicator "agriculture-production" "produksi pertanian"

          # Direct numeric statistics from Banten public CKAN DataStore
          curl_json "https://data.bantenprov.go.id/api/3/action/datastore_search?resource_id=6e533cef-056d-4dbc-a689-8f388d6cb6c7&limit=100" "tmp-domains/stat-unemployment.json"
          curl_json "https://data.bantenprov.go.id/api/3/action/datastore_search?resource_id=cabba131-d45d-4920-b224-2f0ade451466&limit=250" "tmp-domains/stat-poverty.json"
          curl_json "https://data.bantenprov.go.id/api/3/action/datastore_search?resource_id=785712cd-82a9-44ed-a6fe-3d54ec3432c8&limit=100" "tmp-domains/stat-revenue.json"
          curl_json "https://data.bantenprov.go.id/api/3/action/datastore_search?resource_id=ec8cc1b4-9f87-46fd-98cb-d2aab92fb52a&limit=50" "tmp-domains/stat-smk.json"
          curl_json "https://data.bantenprov.go.id/api/3/action/datastore_search?resource_id=07164307-c64e-432a-aaac-d27b5196df22&limit=50" "tmp-domains/stat-hospital-beds.json"
          curl_json "https://data.bantenprov.go.id/api/3/action/datastore_search?resource_id=143df65f-35ee-4419-91b6-b289e368a488&limit=50" "tmp-domains/stat-waste.json"
          curl_json "https://data.bantenprov.go.id/api/3/action/datastore_search?resource_id=e3548ec4-68b5-44fc-bd8c-fcf514c2007d&limit=500" "tmp-domains/stat-agriculture.json"
          curl_json "https://data.bantenprov.go.id/api/3/action/datastore_search?resource_id=60a377b4-d6a0-401f-ad82-dd30e7780393&limit=1000" "tmp-domains/stat-ihk.json"

          jq -n \
            --slurpfile unemployment tmp-domains/stat-unemployment.json \
            --slurpfile poverty tmp-domains/stat-poverty.json \
            --slurpfile revenue tmp-domains/stat-revenue.json \
            --slurpfile smk tmp-domains/stat-smk.json \
            --slurpfile beds tmp-domains/stat-hospital-beds.json \
            --slurpfile waste tmp-domains/stat-waste.json \
            --slurpfile agriculture tmp-domains/stat-agriculture.json \
            --slurpfile ihk tmp-domains/stat-ihk.json \
            --slurpfile food live/foodstation-products.json \
            'def n:
               if type=="number" then .
               elif type=="string" then (gsub("\\.";"")|gsub(",";".")|tonumber? // 0)
               else 0 end;
             {
               generated_at:(now|todateiso8601),
               employment:{
                 label:"Tingkat Pengangguran Terbuka kabupaten/kota Banten",
                 year:2024,
                 month:"Agustus",
                 unit:"persen",
                 records:[
                   $unemployment[0].result.records[]
                   | select(.tahun==2024 and .bulan=="Agustus")
                   | select(.["persentase tingkat pengangguran terbuka (TPT) (%)"]!="")
                   | {
                       area:.["kabupaten kota"],
                       value:(.["persentase tingkat pengangguran terbuka (TPT) (%)"]|n)
                     }
                 ]
               },
               poverty:{
                 label:"Jumlah penduduk miskin Banten",
                 year:2024,
                 unit:"ribu orang",
                 record:(
                   [
                     $poverty[0].result.records[]
                     | select((.provinsi|ascii_downcase)=="banten" and .tahun==2024)
                     | {
                         province:.provinsi,
                         value:(.["jumlah penduduk miskin (ribu)"]|n)
                       }
                   ][0] // null
                 )
               },
               revenue:{
                 label:"Realisasi pendapatan Pemerintah Provinsi Banten",
                 year:2024,
                 unit:"rupiah",
                 records:[
                   $revenue[0].result.records[]
                   | {
                       category:.["Jenis pendapatan"],
                       value_thousand:(.value|n)
                     }
                 ]
               },
               education:{
                 label:"Jumlah Sekolah Menengah Kejuruan Banten",
                 unit:"unit",
                 series:[
                   $smk[0].result.records[]
                   | {year:.Tahun,value:(.Unit|n)}
                 ]
               },
               health:{
                 label:"Tempat tidur rumah sakit Banten",
                 unit:"unit",
                 series:[
                   $beds[0].result.records[]
                   | {year:.Tahun,value:(.Unit|n)}
                 ]
               },
               environment:{
                 label:"Sampah spesifik/kondisi khusus tertangani Banten",
                 unit:"ton",
                 series:[
                   $waste[0].result.records[]
                   | {year:.Tahun,value:(.Ton|n)}
                 ]
               },
               agriculture:{
                 label:"Produksi perkebunan Banten",
                 year:2024,
                 unit:"ton",
                 records:[
                   $agriculture[0].result.records[]
                   | select(.tahun==2024)
                   | {
                       area:.["kabupaten kota"],
                       commodity:.["jenis tanaman"],
                       value:(.["jumlah produksi perkebunan"]|n)
                     }
                 ]
               },
               ihk:{
                 label:"Indeks Harga Konsumen kota pantauan di Banten",
                 unit:"index",
                 records:[
                   $ihk[0].result.records[]
                   | select((.provinsi|ascii_downcase)=="provinsi banten" and (.tahun==2023 or .tahun==2024))
                   | {
                       city:.["kabupaten kota"],
                       year:.tahun,
                       value:(.["indeks harga konsumen"]|n)
                     }
                   | select(.value>0)
                 ]
               },
               food_prices:{
                 label:"Harga produk pangan Food Station",
                 currency:"IDR",
                 products:[
                   $food[0][]
                   | {
                       name,
                       price:(
                         (.prices.price|tonumber? // 0) /
                         (
                           if (.prices.currency_minor_unit|tonumber? // 0)==3 then 1000
                           elif (.prices.currency_minor_unit|tonumber? // 0)==2 then 100
                           elif (.prices.currency_minor_unit|tonumber? // 0)==1 then 10
                           else 1 end
                         )
                       ),
                       in_stock:.is_in_stock,
                       permalink
                     }
                   | select(.price>0)
                 ][:12]
               }
             }' > live/direct-stats.json

          jq -e '
            (.employment.records|length)>0 and
            (.poverty.record.value>0) and
            (.revenue.records|length)>0 and
            (.education.series|length)>0 and
            (.health.series|length)>0 and
            (.environment.series|length)>0 and
            (.agriculture.records|length)>0 and
            (.ihk.records|length)>0 and
            (.food_prices.products|length)>0
          ' live/direct-stats.json >/dev/null

          # Thematic domain discovery from public CKAN catalogs
          for spec in \
            "education:pendidikan" \
            "health:kesehatan" \
            "economy:ekonomi" \
            "environment:lingkungan" \
            "agriculture:pertanian" \
            "demography:penduduk" \
            "social:kemiskinan" \
            "employment:ketenagakerjaan" \
            "finance:keuangan"
          do
            slug="${spec%%:*}"
            query="${spec#*:}"
            fetch_domain "$slug" "$query"
          done

          # Strict validation
          jq -e '(.data|type=="array") and (.data|length>0)' live/weather-kemayoran.json >/dev/null
          jq -e '.Infogempa.gempa != null' live/earthquake-latest.json >/dev/null
          jq -e '(.Infogempa.gempa|type=="array")' live/earthquake-m5.json >/dev/null
          jq -e '(.Infogempa.gempa|type=="array")' live/earthquake-felt.json >/dev/null

          jq -e '.count > 0' live/big-village-count.json >/dev/null
          jq -e '(.features|type=="array") and (.features|length>0)' live/big-village-sample.json >/dev/null

          jq -e '.success == true and (.result.results|type=="array")' live/banten-datasets.json >/dev/null
          jq -e '.success == true and (.result.results|type=="array")' live/grobogan-datasets.json >/dev/null

          jq -e 'type=="array" and length>0' live/foodstation-products.json >/dev/null
          jq -e '(.features|type=="array") and (.features|length>0)' live/pamjaya-complaints.json >/dev/null
          jq -e 'type=="array" and length>0' live/waskita-posts.json >/dev/null

          jq -e '(.features|type=="array") and (.features|length>0)' live/jakarta-transport.json >/dev/null
          jq -e '.count > 0' live/jakarta-roads-count.json >/dev/null
          jq -e '.count > 0' live/jakarta-rdtr-count.json >/dev/null
          jq -e '.count > 0' live/esdm-wells-count.json >/dev/null
          jq -e '.count > 0' live/esdm-wk2026-count.json >/dev/null

          for f in live/domain-*.json; do
            jq -e '.count >= 0 and (.items|type=="array")' "$f" >/dev/null
          done

          jq -s '
            {
              generated_at:(now|todateiso8601),
              indicators:(
                map({
                  key:.indicator,
                  query:.query,
                  matches:.matches,
                  datasets:.datasets
                })
              )
            }' live/indicator-*.json > live/indicator-summary.json

          jq -e '(.indicators|type=="array") and (.indicators|length==9)' live/indicator-summary.json >/dev/null

          # Compact cross-domain snapshot for the frontend
          jq -n \
            --slurpfile education live/domain-education.json \
            --slurpfile health live/domain-health.json \
            --slurpfile economy live/domain-economy.json \
            --slurpfile environment live/domain-environment.json \
            --slurpfile agriculture live/domain-agriculture.json \
            --slurpfile demography live/domain-demography.json \
            --slurpfile social live/domain-social.json \
            --slurpfile employment live/domain-employment.json \
            --slurpfile finance live/domain-finance.json \
            --slurpfile transport live/jakarta-transport.json \
            --slurpfile roads live/jakarta-roads-count.json \
            --slurpfile rdtr live/jakarta-rdtr-count.json \
            --slurpfile wells live/esdm-wells-count.json \
            --slurpfile wk live/esdm-wk2026-count.json \
            '{
              thematic:{
                education:$education[0],
                health:$health[0],
                economy:$economy[0],
                environment:$environment[0],
                agriculture:$agriculture[0],
                demography:$demography[0],
                social:$social[0],
                employment:$employment[0],
                finance:$finance[0]
              },
              operational:{
                transport:{
                  count:($transport[0].features|length),
                  modes:(
                    [$transport[0].features[]?.attributes.fungsi // "Lainnya"]
                    | sort
                    | group_by(.)
                    | map({name:.[0],count:length})
                    | sort_by(-.count)
                  )
                },
                roads:{count:($roads[0].count // 0)},
                rdtr:{count:($rdtr[0].count // 0)},
                oil_gas_wells:{count:($wells[0].count // 0)},
                oil_gas_working_areas_2026:{count:($wk[0].count // 0)}
              }
            }' > live/domain-summary.json

          DOMAIN_COUNTS=$(jq -c '.thematic | with_entries(.value=.value.count)' live/domain-summary.json)

          cat > live/status.json <<EOF
          {
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "policy": "public-rest-no-auth-only",
            "source_count": 12,
            "sources": {
              "bmkg_weather": true,
              "bmkg_earthquake": true,
              "big_admin_boundaries": true,
              "banten_ckan": true,
              "grobogan_ckan": true,
              "foodstation_store": true,
              "pamjaya_complaints": true,
              "waskita_posts": true,
              "jakarta_transport": true,
              "jakarta_roads": true,
              "jakarta_rdtr": true,
              "esdm_migas": true
            },
            "metrics": {
              "big_features": $(jq -r '.count' live/big-village-count.json),
              "banten_datasets": $(jq -r '.result.count' live/banten-datasets.json),
              "grobogan_datasets": $(jq -r '.result.count' live/grobogan-datasets.json),
              "earthquake_m5_records": $(jq -r '.Infogempa.gempa|length' live/earthquake-m5.json),
              "earthquake_felt_records": $(jq -r '.Infogempa.gempa|length' live/earthquake-felt.json),
              "foodstation_products": $(jq -r 'length' live/foodstation-products.json),
              "pamjaya_areas": $(jq -r '.features|length' live/pamjaya-complaints.json),
              "pamjaya_complaints": $(jq -r '[.features[].attributes.sum_keluha // 0] | add // 0' live/pamjaya-complaints.json),
              "waskita_posts": $(jq -r 'length' live/waskita-posts.json),
              "jakarta_transport_points": $(jq -r '.operational.transport.count' live/domain-summary.json),
              "jakarta_road_features": $(jq -r '.operational.roads.count' live/domain-summary.json),
              "jakarta_rdtr_features": $(jq -r '.operational.rdtr.count' live/domain-summary.json),
              "esdm_oil_gas_wells": $(jq -r '.operational.oil_gas_wells.count' live/domain-summary.json),
              "esdm_working_areas_2026": $(jq -r '.operational.oil_gas_working_areas_2026.count' live/domain-summary.json),
              "direct_statistics": 9,
              "regional_open_data": $(jq -r '[.regions[] | select(.available==true)] | length' live/regional-summary.json)
            },
            "domains": $DOMAIN_COUNTS
          }
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
