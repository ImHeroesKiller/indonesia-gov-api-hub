name: Probe BUMN BUMD Public REST

on:
  push:
    paths:
      - ".github/workflows/probe-bumn-bumd.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Discover Pos Indonesia public postal-code data calls
        shell: bash
        run: |
          set +e
          work=$(mktemp -d)

          curl -L --connect-timeout 10 --max-time 25 -A "Mozilla/5.0 NusaData-Probe"             -sS "https://kodepos.posindonesia.co.id/" -o "$work/pos.html"

          echo "===== URL/API refs ====="
          grep -Eo 'https?://[^"'\'' <>()]+' "$work/pos.html"             | grep -Ei '(api|json|ajax|search|kodepos|address|wilayah|province|city)'             | sort -u | head -n 120 || true

          echo "===== AJAX/fetch contexts ====="
          grep -Eo '.{0,200}(\$\.ajax|ajax\(|fetch\(|axios|url[[:space:]]*:).{0,350}' "$work/pos.html"             | head -n 160 || true

          echo "===== FORM actions ====="
          grep -Eo '<form[^>]+action=["'\''][^"'\'']+' "$work/pos.html"             | sed -E 's/.*action=["'\'']//' | head -n 80 || true

          echo "===== Scripts ====="
          grep -Eo '<script[^>]+src=["'\''][^"'\'']+' "$work/pos.html"             | sed -E 's/.*src=["'\'']//' | head -n 50 || true

          echo "===== Search page source ====="
          curl -L --connect-timeout 10 --max-time 25 -A "Mozilla/5.0 NusaData-Probe"             -sS "https://kodepos.posindonesia.co.id/?act=searchaddress&f=35&kw=10210&w=%28Semua%29"             -o "$work/search.html"
          grep -Eo '.{0,200}(\$\.ajax|ajax\(|fetch\(|axios|url[[:space:]]*:).{0,350}' "$work/search.html"             | head -n 160 || true
          grep -Eo 'https?://[^"'\'' <>()]+' "$work/search.html"             | grep -Ei '(api|json|ajax|search|kodepos|address)'             | sort -u | head -n 120 || true
