name: Probe BUMN BUMD Public REST

on:
  push:
    paths:
      - ".github/workflows/probe-bumn-bumd.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Discover KAI public webcorp API routes
        shell: bash
        run: |
          set +e
          work=$(mktemp -d)

          curl -L --connect-timeout 8 --max-time 20 -A "Mozilla/5.0" -sS https://www.kai.id/ -o "$work/home.html"
          grep -Eo '/_next/static/chunks/[^"'\'' ]+\.js' "$work/home.html" | sort -u > "$work/scripts.txt"

          : > "$work/all.js"
          head -n 90 "$work/scripts.txt" | while read -r p; do
            curl -L --connect-timeout 5 --max-time 12 -A "Mozilla/5.0" -sS "https://www.kai.id$p" >> "$work/all.js"
            echo >> "$work/all.js"
          done

          echo "===== KAI PATH-LIKE STRING LITERALS ====="
          grep -Eo '["'\'']/[A-Za-z0-9_./?=&{}:%-]{2,120}["'\'']' "$work/all.js"             | tr -d "'\""             | grep -Ev '^/_next|^/api/(consent|locale)$|\.(svg|png|webp|jpg|jpeg|gif|woff|css|js)$'             | sort -u             | head -n 300 || true

          echo "===== KAI DATA KEYWORD CONTEXTS ====="
          grep -Eo '.{0,220}(article|artikel|berita|publikasi|publication|news|press|facility|fasilitas|service|layanan|station|stasiun|subsidiary|anak-perusahaan|gallery|galeri|promo|innovation|inovasi).{0,350}' "$work/all.js"             | grep -Ei '(get\(|post\(|fetch|axios|API_URL|msvc)'             | head -n 180 || true

          echo "===== API BASE USAGE CONTEXTS ====="
          grep -Eo '.{0,300}(85149|API_URL|msvc-webcorp).{0,600}' "$work/all.js" | head -n 120 || true
