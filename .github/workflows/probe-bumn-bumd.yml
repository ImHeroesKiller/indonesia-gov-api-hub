name: Probe BUMN BUMD Public REST

on:
  push:
    paths:
      - ".github/workflows/probe-bumn-bumd.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Discover ASDP KAI LRT public JSON calls
        shell: bash
        run: |
          set +e
          work=$(mktemp -d)

          inspect () {
            name="$1"
            url="$2"
            echo "===== $name ====="
            out="$3"
            curl -L --connect-timeout 8 --max-time 25 -A "Mozilla/5.0 NusaData-Probe" -sS "$url" -o "$out"
            echo "size=$(wc -c < "$out" 2>/dev/null)"
          }

          inspect "ASDP commercial routes" "https://www.asdp.id/peta-lintasan-komersil" "$work/asdp.html"
          echo "-- ASDP URL refs --"
          grep -Eo 'https?://[^"'\'' <>()]+' "$work/asdp.html" | grep -Ei '(api|json|ajax|route|rute|lintasan|schedule|jadwal)' | sort -u | head -n 120 || true
          echo "-- ASDP ajax/fetch contexts --"
          grep -Eo '.{0,180}(fetch\(|axios|\$\.ajax|ajax\(|url[[:space:]]*:).{0,300}' "$work/asdp.html" | head -n 120 || true
          echo "-- ASDP scripts --"
          grep -Eo '<script[^>]+src=["'\''][^"'\'']+' "$work/asdp.html" | sed -E 's/.*src=["'\'']//' | head -n 40 || true

          inspect "KAI homepage" "https://www.kai.id/" "$work/kai.html"
          grep -Eo '/_next/static/chunks/[^"'\'' ]+\.js' "$work/kai.html" | sort -u | head -n 35 > "$work/kai-scripts.txt"
          : > "$work/kai.js"
          while read -r p; do
            curl -L --connect-timeout 5 --max-time 10 -A "Mozilla/5.0" -sS "https://www.kai.id$p" >> "$work/kai.js"
            echo >> "$work/kai.js"
          done < "$work/kai-scripts.txt"
          echo "-- KAI likely API contexts --"
          grep -Eo '.{0,160}(hello-bar|publikasi|artikel|berita|media|msvc-webcorp).{0,280}' "$work/kai.js" | grep -Ei '(api|fetch|axios|get\(|post\()' | head -n 100 || true
          echo "-- KAI URL/string fragments --"
          strings "$work/kai.js" | grep -Eo '["'\''][A-Za-z0-9_./?=&:{}-]{4,}["'\'']' | grep -Ei '(hello|artikel|berita|publikasi|news|media|api)' | sort -u | head -n 120 || true

          inspect "LRT Jakarta" "https://www.lrtjakarta.co.id/" "$work/lrt.html"
          echo "-- LRT API refs --"
          grep -Eo 'https?://[^"'\'' <>()]+' "$work/lrt.html" | grep -Ei '(api|json|ajax|station|stasiun|schedule|jadwal)' | sort -u | head -n 100 || true
          echo "-- LRT ajax/fetch contexts --"
          grep -Eo '.{0,180}(fetch\(|axios|\$\.ajax|ajax\(|url[[:space:]]*:).{0,300}' "$work/lrt.html" | head -n 100 || true
          echo "-- LRT scripts --"
          grep -Eo '<script[^>]+src=["'\''][^"'\'']+' "$work/lrt.html" | sed -E 's/.*src=["'\'']//' | head -n 40 || true
