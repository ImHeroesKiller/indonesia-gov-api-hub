name: Probe BUMN BUMD Public REST

on:
  push:
    paths:
      - ".github/workflows/probe-bumn-bumd.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PLN and PAM JAYA public ArcGIS REST
        shell: bash
        run: |
          set +e

          probe () {
            name="$1"
            url="$2"
            echo "===== $name ====="
            tmp=$(mktemp)
            code=$(curl -L --retry 1 --connect-timeout 10 --max-time 30               -A "NusaData-Probe/1.0" -H "Accept: application/json"               -sS -w "%{http_code}" -o "$tmp" "$url")
            echo "HTTP=$code"
            if jq -e . "$tmp" >/dev/null 2>&1; then
              echo "JSON=valid"
              jq -c 'if type=="object" then keys else type end' "$tmp" | head -c 900
              echo
              jq -c '.' "$tmp" | head -c 2800
              echo
            else
              echo "JSON=invalid"
              head -c 600 "$tmp"
              echo
            fi
            rm -f "$tmp"
          }

          probe "PLN portal info"             "https://maps.pln.co.id/arcgis/sharing/rest/portals/self?f=json"

          probe "PLN public SPKLU search"             "https://maps.pln.co.id/arcgis/sharing/rest/search?q=SPKLU&num=20&f=json"

          probe "PLN public Feature Service search"             "https://maps.pln.co.id/arcgis/sharing/rest/search?q=type%3A%22Feature%20Service%22%20access%3Apublic&num=20&f=json"

          probe "PAM JAYA KELUHAN map metadata"             "https://geoportal.pamjaya.co.id/server/rest/services/DATA/KELUHAN/MapServer?f=pjson"

          probe "PAM JAYA aggregate layer metadata"             "https://geoportal.pamjaya.co.id/server/rest/services/DATA/KELUHAN/MapServer/3?f=pjson"

          probe "PAM JAYA aggregate complaint count"             "https://geoportal.pamjaya.co.id/server/rest/services/DATA/KELUHAN/MapServer/3/query?where=1%3D1&returnCountOnly=true&f=json"

          probe "PAM JAYA aggregate complaint sample"             "https://geoportal.pamjaya.co.id/server/rest/services/DATA/KELUHAN/MapServer/3/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=8&f=json"
