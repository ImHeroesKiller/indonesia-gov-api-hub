name: Probe BUMN BUMD Public REST

on:
  push:
    paths:
      - ".github/workflows/probe-bumn-bumd.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe focused public endpoints
        shell: bash
        run: |
          set +e
          work=$(mktemp -d)

          probe () {
            name="$1"
            url="$2"
            echo "===== $name ====="
            tmp=$(mktemp)
            code=$(curl -L --connect-timeout 8 --max-time 18 -A "NusaData-Probe/1.0" -H "Accept: application/json" -sS -w "%{http_code}" -o "$tmp" "$url")
            echo "HTTP=$code"
            if jq -e . "$tmp" >/dev/null 2>&1; then
              echo "JSON=valid"
              jq -c 'if type=="object" then keys else type end' "$tmp" | head -c 800
              echo
              jq -c '.' "$tmp" | head -c 1800
              echo
            else
              echo "JSON=invalid"
              head -c 400 "$tmp"
              echo
            fi
            rm -f "$tmp"
          }

          echo "===== KAI public site refs ====="
          curl -L --connect-timeout 8 --max-time 18 -A "Mozilla/5.0" -sS https://www.kai.id/ -o "$work/kai.html"
          grep -Eo 'https://api\.kai\.id/msvc-webcorp[^"'\'' <>()\\]+' "$work/kai.html" | sed 's/\\$//' | sort -u | head -n 40 || true

          probe "KAI hello bar ID" "https://api.kai.id/msvc-webcorp/id/hello-bar"
          probe "KAI hello bar default" "https://api.kai.id/msvc-webcorp/hello-bar"

          # Candidate collection routes only if they respond as public JSON.
          probe "KAI articles v2" "https://api.kai.id/msvc-webcorp/api/v2/articles"
          probe "KAI article-news v2" "https://api.kai.id/msvc-webcorp/api/v2/article-news"
          probe "KAI publications v2" "https://api.kai.id/msvc-webcorp/api/v2/publications"
          probe "KAI news v2" "https://api.kai.id/msvc-webcorp/api/v2/news"

          echo "===== MRT public bundle refs ====="
          curl -L --connect-timeout 8 --max-time 18 -A "Mozilla/5.0" -sS https://jakartamrt.co.id/ -o "$work/mrt.html"
          mrtjs=$(grep -Eo '/assets/index-[^"'\'' ]+\.js' "$work/mrt.html" | head -n1)
          if [ -n "$mrtjs" ]; then
            curl -L --connect-timeout 8 --max-time 18 -A "Mozilla/5.0" -sS "https://jakartamrt.co.id$mrtjs" -o "$work/mrt.js"
            grep -Eo 'https?://[^"'\'' <>()]+' "$work/mrt.js" | grep -Ei '(api|json|graphql|rest)' | sort -u | head -n 40 || true
          fi

          echo "===== TransJakarta public route HTML refs ====="
          curl -L --connect-timeout 8 --max-time 18 -A "Mozilla/5.0" -sS https://www.transjakarta.co.id/rute -o "$work/tj.html"
          grep -Eo 'https?://[^"'\'' <>()]+' "$work/tj.html" | grep -Ei '(api|json|route|rute)' | sort -u | head -n 40 || true
