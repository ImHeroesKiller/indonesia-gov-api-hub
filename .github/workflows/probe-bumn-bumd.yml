name: Probe BUMN BUMD Public REST

on:
  push:
    paths:
      - ".github/workflows/probe-bumn-bumd.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PLN public content REST
        shell: bash
        run: |
          set +e
          probe () {
            name="$1"
            url="$2"
            echo "===== $name ====="
            tmp=$(mktemp)
            code=$(curl -L --retry 1 --connect-timeout 10 --max-time 25               -A "NusaData-Probe/1.0" -H "Accept: application/json"               -sS -w "%{http_code}" -o "$tmp" "$url")
            echo "HTTP=$code"
            echo "MIME=$(file -b --mime-type "$tmp" 2>/dev/null)"
            if jq -e . "$tmp" >/dev/null 2>&1; then
              echo "JSON=valid"
              jq -c 'if type=="object" then keys else type end' "$tmp" | head -c 800
              echo
              jq -c '.' "$tmp" | head -c 2600
              echo
            else
              echo "JSON=invalid"
              head -c 700 "$tmp"
              echo
            fi
            rm -f "$tmp"
          }

          probe "PLN WP REST root" "https://web.pln.co.id/wp-json/"
          probe "PLN public posts" "https://web.pln.co.id/wp-json/wp/v2/posts?per_page=10&_fields=id,date,modified,link,title,excerpt"
          probe "PLN media" "https://web.pln.co.id/wp-json/wp/v2/media?per_page=5&_fields=id,date,link,slug"
          probe "ASDP WP REST root" "https://www.asdp.id/wp-json/"
          probe "Pelindo WP REST root" "https://pelindo.co.id/wp-json/"
