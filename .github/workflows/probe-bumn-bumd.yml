name: Probe BUMN BUMD Public REST

on:
  push:
    paths:
      - ".github/workflows/probe-bumn-bumd.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect PELNI and TransJakarta public data calls
        shell: bash
        run: |
          set +e
          work=$(mktemp -d)

          echo "===== PELNI ====="
          curl -L --connect-timeout 8 --max-time 25 -A "Mozilla/5.0" -sS https://pelni.co.id/reservasi-tiket -o "$work/pelni.html"
          echo "-- URL/API refs --"
          grep -Eo 'https?://[^"'\'' <>()]+' "$work/pelni.html" | grep -Ei '(api|json|ajax|schedule|jadwal|port|pelabuhan)' | sort -u | head -n 80 || true
          echo "-- AJAX/fetch contexts --"
          grep -Eo '.{0,220}(\$\.ajax|ajax\(|fetch\(|axios|url:).{0,320}' "$work/pelni.html" | head -n 120 || true
          echo "-- JS refs --"
          grep -Eo '<script[^>]+src=["'\''][^"'\'']+' "$work/pelni.html" | sed -E 's/.*src=["'\'']//' | head -n 30 || true

          echo "===== TRANSJAKARTA ====="
          curl -L --connect-timeout 8 --max-time 25 -A "Mozilla/5.0" -sS https://www.transjakarta.co.id/rute -o "$work/tj.html"
          echo "-- AJAX blocks --"
          grep -n -A10 -B3 '\$\.ajax' "$work/tj.html" | head -n 220 || true
          echo "-- URL lines near AJAX --"
          grep -nE 'url[[:space:]]*:' "$work/tj.html" | head -n 80 || true
          echo "-- relative endpoint strings --"
          grep -Eo '["'\'']/[A-Za-z0-9_./?=&-]+["'\'']' "$work/tj.html" | grep -Ei '(api|rute|route|koridor|halte|ajax)' | sort -u | head -n 100 || true
