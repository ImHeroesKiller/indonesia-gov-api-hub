name: Probe Domain Public REST

on:
  push:
    paths:
      - ".github/workflows/probe-domains.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe environment and energy domain layers
        shell: bash
        run: |
          set +e

          inspect () {
            name="$1"; url="$2"
            echo "===== $name ====="
            tmp=$(mktemp)
            code=$(curl -L --connect-timeout 10 --max-time 30 -A "NusaData-Probe/1.0" -sS -w "%{http_code}" -o "$tmp" "$url")
            echo "HTTP=$code BYTES=$(wc -c < "$tmp")"
            if jq -e . "$tmp" >/dev/null 2>&1; then
              echo "JSON=valid"
              jq -c 'if type=="object" then {keys:keys,layers:(.layers//[]|map({id,name})),folders:(.folders//[]),services:(.services//[]|map(.name))} else . end' "$tmp" | head -c 5000
              echo
            else
              echo "JSON=invalid"
              head -c 400 "$tmp" | tr '\n' ' '; echo
            fi
            rm -f "$tmp"
          }

          inspect "Jakarta Taman" "https://gis-dpmptsp.jakarta.go.id/arcgis/rest/services/Hosted/Taman/FeatureServer?f=pjson"
          inspect "Jakarta Public Transport Coverage" "https://gis-dpmptsp.jakarta.go.id/arcgis/rest/services/Hosted/Public_Transport_Coverage_2025/FeatureServer?f=pjson"
          inspect "ESDM MDR2 folder" "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2?f=pjson"
          inspect "ESDM VDR folder" "https://datamigas.esdm.go.id/arcgis/rest/services/VDR?f=pjson"
