name: Probe Domain Public REST

on:
  push:
    paths:
      - ".github/workflows/probe-domains.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Final domain count validation
        shell: bash
        run: |
          set -e
          check_count () {
            name="$1"; url="$2"
            echo "===== $name ====="
            v=$(curl -fL --retry 1 --connect-timeout 10 --max-time 30 -A "NusaData-Probe/1.0" -sS "$url")
            echo "$v" | jq -e '.count >= 0'
            echo "$v" | jq -c .
          }
          check_count "ESDM wells" "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/well/MapServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
          check_count "ESDM WK 2026" "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/WK_2026_TAHAP_1/MapServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
          check_count "Jakarta transport" "https://gis-dpmptsp.jakarta.go.id/arcgis/rest/services/Hosted/Titik_Transportasi_Umum_Jakarta_v3/FeatureServer/26/query?where=1%3D1&returnCountOnly=true&f=json"
          check_count "Jakarta roads" "https://gis-dpmptsp.jakarta.go.id/arcgis/rest/services/Hosted/Peta_Jalan_DKI/FeatureServer/1/query?where=1%3D1&returnCountOnly=true&f=json"
          check_count "Jakarta RDTR" "https://gis-dpmptsp.jakarta.go.id/arcgis/rest/services/Hosted/rdtr_2022_new/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
