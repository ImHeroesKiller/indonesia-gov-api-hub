name: Probe Domain Public REST

on:
  push:
    paths:
      - ".github/workflows/probe-domains.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Discover official public domain layers
        shell: bash
        run: |
          set +e
          echo "===== JAKARTA HOSTED SERVICES MATCHES ====="
          curl -L --connect-timeout 10 --max-time 35 -A "NusaData-Probe/1.0" -sS             "https://gis-dpmptsp.jakarta.go.id/arcgis/rest/services/Hosted?f=pjson" |
            jq -r '.services[]?.name' |
            grep -Ei '(sekolah|pendidik|rumah.?sakit|puskesmas|kesehatan|pasar|transport|jalan|rdtr|taman|hijau|banjir|sungai|air|terminal|halte)' |
            sort -u | head -n 250

          echo "===== ESDM DATA MIGAS ROOT ====="
          tmp=$(mktemp)
          code=$(curl -L --connect-timeout 10 --max-time 35 -A "NusaData-Probe/1.0" -sS -w "%{http_code}"             -o "$tmp" "https://datamigas.esdm.go.id/arcgis/rest/services?f=pjson")
          echo "HTTP=$code"
          if jq -e . "$tmp" >/dev/null 2>&1; then
            echo "JSON=valid"
            jq -r '.folders[]?, .services[]?.name' "$tmp" | head -n 250
          else
            echo "JSON=invalid"
          fi

          echo "===== JAKARTA KNOWN COUNTS ====="
          probe_count () {
            name="$1"; url="$2"
            echo "-- $name"
            curl -L --connect-timeout 8 --max-time 25 -A "NusaData-Probe/1.0" -sS "$url" | jq -c .
          }
          probe_count "Transport" "https://gis-dpmptsp.jakarta.go.id/arcgis/rest/services/Hosted/Titik_Transportasi_Umum_Jakarta_v3/FeatureServer/26/query?where=1%3D1&returnCountOnly=true&f=json"
          probe_count "Roads" "https://gis-dpmptsp.jakarta.go.id/arcgis/rest/services/Hosted/Peta_Jalan_DKI/FeatureServer/1/query?where=1%3D1&returnCountOnly=true&f=json"
          probe_count "RDTR" "https://gis-dpmptsp.jakarta.go.id/arcgis/rest/services/Hosted/rdtr_2022_new/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
