name: Probe Public REST Candidates

on:
  push:
    paths:
      - ".github/workflows/probe-public-rest.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        shell: bash
        run: |
          set +e

          probe () {
            name="$1"
            url="$2"
            echo "===== $name ====="
            tmp=$(mktemp)
            code=$(curl -L --retry 1 --connect-timeout 10 --max-time 30 -A "NusaData-Probe/1.0" -H "Accept: application/json" -sS -w "%{http_code}" -o "$tmp" "$url")
            echo "HTTP=$code"
            if jq -e . "$tmp" >/dev/null 2>&1; then
              echo "JSON=valid"
              jq -c 'if type=="object" then keys else type end' "$tmp" | head -c 1200
              echo
              jq -c '.' "$tmp" | head -c 2500
              echo
            else
              echo "JSON=invalid"
              head -c 700 "$tmp"
              echo
            fi
            rm -f "$tmp"
          }

          probe "BNPB weekly disasters" "https://gis.bnpb.go.id/server/rest/services/Kejadian_Bencana_Mingguan/FeatureServer/0/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=5&orderByFields=OBJECTID%20DESC&f=json"

          probe "BNPB weekly layer metadata" "https://gis.bnpb.go.id/server/rest/services/Kejadian_Bencana_Mingguan/FeatureServer/0?f=pjson"

          probe "BIG village count" "https://geoservices.big.go.id/rbi/rest/services/BATASWILAYAH/Administrasi_AR_KelDesa_10K/MapServer/0/query?where=1%3D1&returnCountOnly=true&f=json"

          probe "BIG sample villages" "https://geoservices.big.go.id/rbi/rest/services/BATASWILAYAH/Administrasi_AR_KelDesa_10K/MapServer/0/query?where=1%3D1&outFields=NAMOBJ%2CWADMKD%2CWADMKC%2CWADMKK%2CWADMPR%2CKDEPUM&returnGeometry=false&resultRecordCount=5&orderByFields=OBJECTID&f=json"

          probe "Banten CKAN" "https://data.bantenprov.go.id/api/3/action/package_search?q=penduduk&rows=5"

          probe "Jayawijaya CKAN" "https://data.jayawijayakab.go.id/api/3/action/package_search?q=penduduk&rows=5"

          probe "Grobogan CKAN" "https://opendata.grobogan.go.id/api/3/action/package_search?q=penduduk&rows=5"
