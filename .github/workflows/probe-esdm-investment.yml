name: Probe ESDM Investment REST

on:
  push:
    paths:
      - ".github/workflows/probe-esdm-investment.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe ESDM investment queries
        shell: bash
        run: |
          set +e
          p(){
            name="$1"; url="$2"
            echo "===== $name ====="
            f=$(mktemp)
            code=$(curl -L --retry 1 --connect-timeout 10 --max-time 35 -A "NusaData-Investment/1.0" -sS -w "%{http_code}" -o "$f" "$url")
            echo "HTTP=$code BYTES=$(wc -c < "$f")"
            jq -c '{error:.error,count:.count,features_count:(.features//[]|length),sample:(.features[0].attributes//null)}' "$f" 2>/dev/null || head -c 500 "$f"
            echo
          }
          p "well count" "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/well/MapServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
          p "well sample" "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/well/MapServer/0/query?where=1%3D1&outFields=%2A&returnGeometry=false&resultRecordCount=8&f=json"
          p "wk count" "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/WK_2026_TAHAP_1/MapServer/0/query?where=1%3D1&returnCountOnly=true&f=json"
          p "wk sample" "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/WK_2026_TAHAP_1/MapServer/0/query?where=1%3D1&outFields=%2A&returnGeometry=false&resultRecordCount=20&f=json"
