name: Probe More BUMN Public REST

on:
  push:
    paths:
      - ".github/workflows/probe-bumn-more.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official BUMN REST endpoints
        shell: bash
        run: |
          set +e
          probe () {
            name="$1"; url="$2"
            echo "===== $name ====="
            tmp=$(mktemp)
            code=$(curl -L --retry 1 --connect-timeout 8 --max-time 20               -A "Mozilla/5.0 NusaData-Probe/1.0"               -H "Accept: application/json" -sS -w "%{http_code}" -o "$tmp" "$url")
            echo "HTTP=$code BYTES=$(wc -c < "$tmp")"
            if jq -e . "$tmp" >/dev/null 2>&1; then
              echo "JSON=valid"
              jq -c 'if type=="object" then keys elif type=="array" then {"type":"array","length":length} else type end' "$tmp" | head -c 900
              echo
            else
              echo "JSON=invalid"
            fi
            rm -f "$tmp"
          }

          probe "BULOG" "https://www.bulog.co.id/wp-json/wp/v2/posts?per_page=3"
          probe "Pegadaian" "https://www.pegadaian.co.id/wp-json/wp/v2/posts?per_page=3"
          probe "Pos Indonesia" "https://www.posindonesia.co.id/wp-json/wp/v2/posts?per_page=3"
          probe "Bio Farma" "https://www.biofarma.co.id/wp-json/wp/v2/posts?per_page=3"
          probe "Pupuk Indonesia" "https://www.pupuk-indonesia.com/wp-json/wp/v2/posts?per_page=3"
          probe "ID FOOD" "https://idfood.co.id/wp-json/wp/v2/posts?per_page=3"
          probe "Semen Indonesia" "https://www.sig.id/wp-json/wp/v2/posts?per_page=3"
          probe "ANTAM" "https://www.antam.com/wp-json/wp/v2/posts?per_page=3"
          probe "TIMAH" "https://timah.com/wp-json/wp/v2/posts?per_page=3"
          probe "WIKA" "https://www.wika.co.id/wp-json/wp/v2/posts?per_page=3"
          probe "ADHI" "https://adhi.co.id/wp-json/wp/v2/posts?per_page=3"
          probe "PTPP" "https://www.ptpp.co.id/wp-json/wp/v2/posts?per_page=3"
          probe "Waskita" "https://www.waskita.co.id/wp-json/wp/v2/posts?per_page=3"
