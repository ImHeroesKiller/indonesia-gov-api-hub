name: Probe Investment Detail

on:
  push:
    paths:
      - ".github/workflows/probe-investment-detail.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect investment-ready REST data
        shell: bash
        run: |
          set -e
          echo "===== KEMENPERIN NIKEL ====="
          curl -fLsS "https://satudata.kemenperin.go.id/id/api/3/action/package_show?id=2025-kapasitas-produksi-industri-olahan-nikel" |
            jq -c '{success,result:{name:.result.name,title:.result.title,resources:[.result.resources[]|{id,name,format,datastore_active,url}]}}'

          echo "===== KEMENPERIN INDUSTRIAL ESTATE ====="
          curl -fLsS "https://satudata.kemenperin.go.id/id/api/3/action/package_show?id=2025-peta-kawasan-industri-eksisting-skala-1-50-000" |
            jq -c '{success,result:{name:.result.name,title:.result.title,resources:[.result.resources[]|{id,name,format,datastore_active,url}]}}'

          echo "===== KEMENPERIN EV ====="
          curl -fLsS "https://satudata.kemenperin.go.id/id/api/3/action/package_search?q=kendaraan%20listrik&rows=10" |
            jq -c '{count:.result.count,items:[.result.results[]|{name,title,resources:[.resources[]|{id,name,format,datastore_active}]}]}'

          echo "===== ESDM WELL FIELDS ====="
          curl -fLsS "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/well/MapServer/0?f=pjson" |
            jq -c '{name,fields:[.fields[]|{name,alias,type}]}'

          echo "===== ESDM WELL SAMPLE ====="
          curl -fLsS "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/well/MapServer/0/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=5&f=json" |
            jq -c '{features:[.features[].attributes]}'

          echo "===== ESDM WK FIELDS ====="
          curl -fLsS "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/WK_2026_TAHAP_1/MapServer/0?f=pjson" |
            jq -c '{name,fields:[.fields[]|{name,alias,type}]}'

          echo "===== ESDM WK SAMPLE ====="
          curl -fLsS "https://datamigas.esdm.go.id/arcgis/rest/services/MDR2/WK_2026_TAHAP_1/MapServer/0/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=20&f=json" |
            jq -c '{features:[.features[].attributes]}'
