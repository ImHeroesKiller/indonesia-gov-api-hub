name: Probe Direct Statistics

on:
  push:
    paths:
      - ".github/workflows/probe-direct-stats.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Find direct public datastore resources
        shell: bash
        run: |
          set -e

          inspect () {
            base="$1"; label="$2"; query="$3"
            echo "===== $label :: $query ====="
            tmp=$(mktemp)
            curl -fL --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30               -A "NusaData-Probe/1.0" -sS               "$base/api/3/action/package_search?q=$query&rows=8" -o "$tmp"
            jq -e '.success==true' "$tmp" >/dev/null
            jq -c '.result.results[] | {
              name,title,modified:.metadata_modified,
              resources:[.resources[]? | select(.datastore_active==true or (.format|ascii_downcase)=="json" or (.format|ascii_downcase)=="csv") | {id,name,format,datastore_active,url}]
            } | select(.resources|length>0)' "$tmp" | head -n 24
          }

          for q in inflasi pengangguran kemiskinan apbd sekolah puskesmas sampah "produksi%20padi"; do
            inspect "https://data.bantenprov.go.id" "BANTEN" "$q"
          done

          for q in inflasi pengangguran kemiskinan apbd sekolah puskesmas sampah "produksi%20padi"; do
            inspect "https://opendata.grobogan.go.id" "GROBOGAN" "$q"
          done
