name: Probe Direct Statistics

on:
  push:
    paths:
      - ".github/workflows/probe-direct-stats.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect hospital beds
        shell: bash
        run: |
          set -e
          curl -fL --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30             -A "NusaData-Probe/1.0" -sS             "https://data.bantenprov.go.id/api/3/action/datastore_search?resource_id=07164307-c64e-432a-aaac-d27b5196df22&limit=100" |
            jq -c '{total:.result.total,fields:(.result.fields|map(.id)),records:.result.records}'
