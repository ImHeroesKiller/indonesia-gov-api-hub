name: Probe Provincial Public REST

on:
  push:
    paths:
      - ".github/workflows/probe-provinces.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe verified provincial candidates
        shell: bash
        run: |
          set +e
          probe () {
            province="$1"; url="$2"
            echo "===== $province ====="
            tmp=$(mktemp)
            code=$(curl -L --retry 1 --connect-timeout 8 --max-time 25 -A "NusaData-Probe/1.0" -H "Accept: application/json" -sS -w "%{http_code}" -o "$tmp" "$url")
            if jq -e '.success==true and (.result.results|type=="array")' "$tmp" >/dev/null 2>&1; then
              echo "HTTP=$code VALID=true"
              jq -c '{count:.result.count,first:(.result.results[0].title//null)}' "$tmp"
            else
              echo "HTTP=$code VALID=false"
              head -c 250 "$tmp" | tr '\n' ' '; echo
            fi
            rm -f "$tmp"
          }
          probe "Aceh" "https://data.acehprov.go.id/id/api/3/action/package_search?rows=1"
          probe "Sumatera Barat" "https://data.sumbarprov.go.id/api/3/action/package_search?rows=1"
          probe "Sumatera Selatan" "https://opendata.sumselprov.go.id/api/3/action/package_search?rows=1"
          probe "Kalimantan Barat" "https://data.kalbarprov.go.id/api/3/action/package_search?rows=1"
