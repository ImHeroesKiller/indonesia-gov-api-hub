name: Probe Provincial Public REST

on:
  push:
    paths:
      - ".github/workflows/probe-provinces.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Jawa Barat public API
        shell: bash
        run: |
          set +e
          for url in \
            "https://opendata.jabarprov.go.id/api/3/action/package_search?rows=1" \
            "https://opendata.jabarprov.go.id/api/3/action/package_search?q=investasi&rows=1"
          do
            echo "===== $url ====="
            tmp=$(mktemp)
            code=$(curl -L --connect-timeout 8 --max-time 25 -A "NusaData-Probe/1.0" -H "Accept: application/json" -sS -w "%{http_code}" -o "$tmp" "$url")
            echo "HTTP=$code"
            if jq -e '.success==true and (.result.results|type=="array")' "$tmp" >/dev/null 2>&1; then
              echo "CKAN_VALID=true"
              jq -c '{count:.result.count,first:(.result.results[0].title//null)}' "$tmp"
            elif jq -e . "$tmp" >/dev/null 2>&1; then
              echo "JSON=true"
              jq -c 'if type=="object" then {keys:keys} else {type:type} end' "$tmp" | head -c 1000
              echo
            else
              echo "JSON=false"
              head -c 250 "$tmp" | tr '\n' ' '; echo
            fi
            rm -f "$tmp"
          done
