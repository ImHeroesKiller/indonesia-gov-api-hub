name: Probe Provincial Public REST

on:
  push:
    paths:
      - ".github/workflows/probe-provinces.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Kalimantan Timur
        shell: bash
        run: |
          set -e
          tmp=$(mktemp)
          code=$(curl -L --retry 1 --connect-timeout 8 --max-time 25 -A "NusaData-Probe/1.0" -H "Accept: application/json" -sS -w "%{http_code}" -o "$tmp" "https://data.kaltimprov.go.id/api/3/action/package_search?rows=1")
          echo "HTTP=$code"
          jq -e '.success==true and (.result.results|type=="array")' "$tmp"
          jq -c '{count:.result.count,first:(.result.results[0].title//null)}' "$tmp"
